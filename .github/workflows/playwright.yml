name: Playwright QA

on:
  # Run daily at 12:00 UTC (7 AM EST / 8 AM EDT).
  schedule:
    - cron: '0 12 * * *'
  push:
    paths:
      - 'qa/playwright-automation/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    paths:
      - 'qa/playwright-automation/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-qa-${{ github.ref }}
  # Keep main-branch and scheduled runs intact; cancel only superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: TypeScript and Playwright tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/playwright-automation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI and API tests
        run: npm test
      - name: Upload Playwright reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            qa/playwright-automation/playwright-report/
            qa/playwright-automation/test-results/
          if-no-files-found: ignore
          retention-days: 14
