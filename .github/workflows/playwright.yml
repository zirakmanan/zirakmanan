name: Playwright QA

on:
  # 12:00 UTC = 7 AM EST / 8 AM EDT.
  schedule:
    - cron: '0 12 * * *'
  push:
    paths:
      - 'qa/playwright-automation/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    paths:
      - 'qa/playwright-automation/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

# Queue runs for the same ref instead of cancelling a useful in-progress run.
concurrency:
  group: playwright-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: TypeScript and Playwright tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/playwright-automation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI and API tests
        run: npm test
      - name: Upload Playwright reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            qa/playwright-automation/playwright-report/
            qa/playwright-automation/test-results/
          if-no-files-found: ignore
          retention-days: 14
